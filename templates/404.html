    <meta name="theme-color" content="#071014" />
    <title>صفحه پیدا نشد | IranAPI</title>
    <style>
      :root { color-scheme: dark; font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e7f8fb; background: linear-gradient(90deg, rgba(34,211,238,.08) 1px, transparent 1px), linear-gradient(0deg, rgba(34,211,238,.05) 1px, transparent 1px), radial-gradient(circle at 20% 10%, rgba(244,63,94,.18), transparent 30%), #071014; background-size: 36px 36px, 36px 36px, auto, auto; }
      main { width: min(720px, 100%); border: 1px solid rgba(34,211,238,.35); border-radius: 14px; padding: clamp(24px, 5vw, 44px); background: rgba(11,18,24,.88); box-shadow: 0 24px 70px rgba(0,0,0,.4); position: relative; overflow: hidden; }
      main::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #22d3ee, #24e07a, transparent); }
      p:first-child { color: #24e07a; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4.4rem); line-height: 1.05; }
      p { color: #90a9b4; line-height: 1.9; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border-radius: 10px; background: linear-gradient(135deg, #22d3ee, #24e07a); color: #021114; text-decoration: none; font-weight: 900; }
    </style>
  </head>

    </main>
  </body>
</html>
