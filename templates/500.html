<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, noarchive" />
    <meta name="theme-color" content="#071014" />
    <title>خطای سامانه | IranAPI</title>
    <style>
      :root { color-scheme: dark; font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e7f8fb; background: linear-gradient(90deg, rgba(34,211,238,.08) 1px, transparent 1px), linear-gradient(0deg, rgba(34,211,238,.05) 1px, transparent 1px), radial-gradient(circle at 75% 18%, rgba(245,158,11,.16), transparent 30%), #071014; background-size: 36px 36px, 36px 36px, auto, auto; }
      main { width: min(720px, 100%); border: 1px solid rgba(245,158,11,.35); border-radius: 14px; padding: clamp(24px, 5vw, 44px); background: rgba(11,18,24,.9); box-shadow: 0 24px 70px rgba(0,0,0,.42); position: relative; overflow: hidden; }
      main::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #f59e0b, #22d3ee, transparent); }
      p:first-child { color: #f59e0b; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 8vw, 4.4rem); line-height: 1.05; }
      p { color: #90a9b4; line-height: 1.9; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border-radius: 10px; background: linear-gradient(135deg, #f59e0b, #22d3ee); color: #021114; text-decoration: none; font-weight: 900; }
    </style>
  </head>
  <body>
    <main>
      <p>Core Fault / 500</p>
      <h1>سامانه لحظه‌ای از مدار خارج شد.</h1>
      <p>جزئیات حساس نمایش داده نمی‌شود. درخواست شما با شناسه لاگ در سمت سرور قابل پیگیری است.</p>
      <a href="/">بازگشت به خانه</a>
    </main>
  </body>
</html>
